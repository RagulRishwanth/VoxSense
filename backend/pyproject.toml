[project]
name = "voxsense-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pydantic>=2.10.0",
    "matplotlib>=3.9.0",
    "shap>=0.46.0"
]

[tool.vercel]
entrypoint = "app.main:app"

